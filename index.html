<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prensa mecánica · Memoria de cálculo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0eb;color:#1d2925;font:16px system-ui,sans-serif}header{background:#183b35;color:white;padding:34px max(5vw,16px)}h1{font:clamp(32px,6vw,60px) Georgia,serif;margin:0}header p{margin:8px 0 0;color:#d3e5db}main{max-width:1330px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(255px,310px) minmax(0,1fr);gap:24px;align-items:start}form,article{background:#fffefa;border:1px solid #cad3cc;border-radius:9px;padding:clamp(16px,3vw,34px)}h2,h3{font-family:Georgia,serif}h2{margin-top:0}article section+section{border-top:2px solid #bccfc4;margin-top:34px;padding-top:28px}h3{margin-top:24px;color:#21594c}fieldset{border:0;padding:0;margin:0 0 18px}legend{font-weight:700;margin-bottom:8px}label{display:block;font-size:.85rem;margin:8px 0}input,select,button{font:inherit;width:100%;padding:7px 8px;border:1px solid #a9b9b0;border-radius:5px;margin-top:3px;background:white;color:inherit}button{cursor:pointer;background:#21594c;color:white;font-weight:650;padding:10px}button.secondary{background:white;color:#21594c}button:disabled{opacity:.48;cursor:default}.eq{overflow-x:auto;padding:8px 10px;background:#f1f5ee;margin:6px 0;border-left:2px solid #86ab98;white-space:pre-wrap;overflow-wrap:anywhere}.eq .katex-display{margin:0;text-align:left}.eq .katex-display>.katex{text-align:left}.note{padding:11px 14px;background:#fff2d5;color:#543b18}.iteration{margin:16px 0;padding:0 12px 8px;border:1px solid #d5dfd6;border-radius:6px}#status{font-size:.85rem}#status:empty{display:none}.table-wrap{overflow:auto;margin-top:8px}table{border-collapse:collapse;font-size:.86rem;width:100%}td,th{padding:7px 9px;text-align:left;border-bottom:1px solid #d5dfd6;white-space:nowrap}thead{background:#eef4ee}details{margin:12px 0}summary{cursor:pointer;font-weight:650;color:#21594c}@media(max-width:760px){main{grid-template-columns:1fr;padding:12px;gap:12px}}
</style>
<header><h1>Prensa mecánica</h1><p>Memoria de cálculo · Potencia y banda plana</p></header>
<main>
<form id="inputs">
<h2>Datos y propuestas</h2>
<fieldset id="powerFields"><legend>Potencia y velocidades</legend></fieldset>
<fieldset id="beltFields"><legend>Poleas y banda</legend><label>Material · tabla 17-2<select name="belt"></select></label></fieldset>
<button type="submit">Calcular</button>
<button class="secondary" type="button" id="restore">Restaurar datos de la tarea</button>
<details><summary>Consultar catálogos</summary><p>Tablas transcritas de clase. La etapa de banda usa la tabla 17-2.</p><div id="catalogs"></div></details>
<button type="button" id="download" disabled>Descargar memoria .tex</button>
<p id="status" role="status"></p>
</form>
<article id="memory" aria-label="Memoria de cálculo"></article>
</main>
<script src="catalogos.js"></script>
<script src="motor.js"></script>
<script src="app.js"></script>
</html>
